name: Publish Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract APP_VERSION and verify versions match
        id: version
        run: |
          BACKEND_VERSION=$(node -p "require('./backend/package.json').version")
          FRONTEND_VERSION=$(node -p "require('./frontend/package.json').version")
          if [ "$BACKEND_VERSION" != "$FRONTEND_VERSION" ]; then
            echo "::error::Version mismatch: backend=$BACKEND_VERSION frontend=$FRONTEND_VERSION"
            exit 1
          fi
          echo "version=$BACKEND_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: ./backend
          push: true
          tags: ghcr.io/thitar/chore-ganizer-backend:${{ steps.version.outputs.version }}

      - name: Build and push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/thitar/chore-ganizer-frontend:${{ steps.version.outputs.version }}

      - name: Build and push backup
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: ./backup
          push: true
          tags: ghcr.io/thitar/chore-ganizer-backup:${{ steps.version.outputs.version }}

      - name: Promote all images to :latest
        if: success()
        run: |
          FAILED=0
          for svc in backend frontend backup; do
            if ! docker buildx imagetools create \
              "ghcr.io/thitar/chore-ganizer-${svc}:${{ steps.version.outputs.version }}" \
              --tag "ghcr.io/thitar/chore-ganizer-${svc}:latest"; then
              echo "::error::Failed to promote chore-ganizer-${svc} to :latest"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more :latest promotions failed — some services may point to a newer version than others. Pin to the explicit :${{ steps.version.outputs.version }} tag for consistent deploys."
            exit 1
          fi
